name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel any in-flight run for the same branch when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    name: Android + AI gateways
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Keep CI on the same pnpm major used to refresh the lockfile.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Check mobile release metadata
        run: pnpm --filter @workspace/gym-tracker-mobile run release:check

      - name: Test Android workspace and optional AI gateways
        run: pnpm test

      - name: Validate level galleries
        run: |
          node docs/design/levels/build-power-catalog.mjs
          node docs/design/levels/preserve-female.mjs

      - name: Build optional local AI gateway
        run: pnpm --filter @workspace/api-server run build

      - name: Build optional Cloudflare AI gateway without deploying
        run: pnpm --filter @workspace/ai-coach-worker build

      - name: Export Android app bundle
        env:
          NODE_ENV: production
        run: pnpm --filter @workspace/gym-tracker-mobile build
